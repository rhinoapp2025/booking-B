# ส่งคำขอของตัวอ่านลิงก์ (ไลน์, กูเกิล, เฟซบุ๊ก) เข้า API
# เพื่อให้แชร์ https://theotel.app/ชื่อโรงแรม ขึ้นชื่อและโลโก้ของโรงแรมนั้น
# ใส่ map นอก server และ location ภายใน server ที่เสิร์ฟ theotel.app
# แล้วเปลี่ยนพอร์ตให้ตรงกับ booking-B

map $http_user_agent $theotel_share_bot {
  default 0;
  ~*(bot|crawler|spider|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Discordbot|WhatsApp|Telegram|Line|Applebot|Googlebot|SkypeUriPreview|Iframely) 1;
}

